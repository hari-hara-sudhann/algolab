spring.application.name=algolab

# Disable Spring Boot's banner; AlgoLab draws its own ANSI terminal UI.
spring.main.banner-mode=off
spring.main.web-application-type=servlet

# Port and workspace root are overridable via env vars (used by the launcher script).
server.port=${SERVER_PORT:8080}
dsa.root=${DSA_ROOT:${user.dir}}

# Local tool: never cache static assets so frontend edits show up on refresh.
spring.web.resources.cache.period=0

# Surface ResponseStatusException reasons (e.g. "Already exists") to the UI.
server.error.include-message=always

# All logs go to ~/.algolab.log only; nothing prints to the console.
logging.file.name=${user.home}/.algolab.log
logging.level.root=INFO
logging.level.com.dsaplayground=TRACE
logging.level.org.springframework=INFO
logging.pattern.console=
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.file-name-pattern=${user.home}/.algolab.log.%d{yyyy-MM-dd}.%i.gz
